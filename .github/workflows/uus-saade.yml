# Uue saate automaatne lisamine avalikule lehele.
#
# Saated ilmuvad enamasti reedel, aga vahel neljapäeval või laupäeval ja eri
# kellaaegadel — seepärast kontrollime neil päevil iga kahe tunni järel, teistel
# päevadel korra hommikul. Kui uut saadet pole, lõpeb töö ~15 sekundiga
# (andmeskriptid ei vaja npm-pakette).
#
# Kui uus saade on olemas ja parser sai sellega kindlalt hakkama:
#   lingid → D1 → deploy → commit main'i → issue kokkuvõttega (teade sulle)
# Kui parser ei saanud hakkama: midagi ei avaldata, avatakse issue.
#
# Vajalikud saladused (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, YOUTUBE_API_KEY
# Lingivõtmeteta läheb saade ikkagi üles, ainult kuulamislinkideta.

name: Uus saade

on:
  schedule:
    - cron: '20 5-21/2 * * 4,5,6'   # N, R, L iga 2 h (UTC; Eestis +3/+2)
    - cron: '20 6 * * 0,1,2,3'      # muudel päevadel korra
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: uus-saade
  cancel-in-progress: false

jobs:
  uus-saade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Feed → lood
        run: |
          node scripts/fetch-feed.mjs
          node scripts/parse-songs.mjs
          node scripts/build-data.mjs

      - name: Kas on uus saade?
        id: check
        run: node scripts/auto-check.mjs

      # ── Parser ei saanud hakkama: ära avalda, ava issue (üks saate kohta) ──
      - name: Ava issue käsitsi tööks
        if: steps.check.outputs.status == 'blocked'
        env:
          # Pealkiri tuleb välisest RSS-ist: ainult keskkonnamuutujana, mitte
          # otse run-plokki interpoleerituna (see oleks käsusüst).
          TITLE: ${{ steps.check.outputs.title }}
          GUIDS: ${{ steps.check.outputs.guids }}
        run: |
          first="${GUIDS%% *}"
          if [ -n "$(gh issue list --state open --search "$first in:body" --json number --jq '.[].number')" ]; then
            echo "Issue on juba avatud — ei tee uut."
          else
            gh issue create --title "Vajab käsitsi sisestamist — $TITLE" --body-file auto-summary.md
          fi

      # ── Korras: avalda ──
      - name: Spotify lingid
        if: steps.check.outputs.status == 'ok'
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/resolve-spotify.mjs

      - name: YouTube lingid
        if: steps.check.outputs.status == 'ok'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/resolve-youtube.mjs

      - name: Andmed kokku
        if: steps.check.outputs.status == 'ok'
        run: |
          node scripts/build-data.mjs
          node scripts/critic-scores.mjs
          node scripts/critic-sheet.mjs
          node scripts/review-list.mjs
          node scripts/seed-songs.mjs
          node scripts/auto-check.mjs --after-resolve

      - name: npm ci
        if: steps.check.outputs.status == 'ok'
        run: npm ci

      # Enne deploy'd: uus frontend viitab lugudele, mis peavad D1-s olemas olema.
      # Seed on ON CONFLICT DO UPDATE — olemasolevaid lugusid ega hindeid ei puutu.
      - name: Lood päris andmebaasi (D1)
        if: steps.check.outputs.status == 'ok'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute rahvanounikud --remote --file=data/seed-songs.sql

      - name: Deploy
        if: steps.check.outputs.status == 'ok'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # Alles pärast õnnestunud deploy'd — kui midagi enne läks katki, proovib
      # järgmine käivitus kõike uuesti, sest main'is on saade endiselt puudu.
      - name: Commit main'i
        if: steps.check.outputs.status == 'ok'
        env:
          # Pealkiri tuleb välisest RSS-ist: ainult keskkonnamuutujana, mitte
          # otse run-plokki interpoleerituna (see oleks käsusüst).
          TITLE: ${{ steps.check.outputs.title }}
          GUIDS: ${{ steps.check.outputs.guids }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "$TITLE" -m "Lisatud automaatselt (GitHub Actions)."
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Teade (issue kokkuvõttega)
        if: steps.check.outputs.status == 'ok'
        env:
          # Pealkiri tuleb välisest RSS-ist: ainult keskkonnamuutujana, mitte
          # otse run-plokki interpoleerituna (see oleks käsusüst).
          TITLE: ${{ steps.check.outputs.title }}
          GUIDS: ${{ steps.check.outputs.guids }}
        run: |
          gh issue create --title "Lehel: $TITLE" --body-file auto-summary.md
